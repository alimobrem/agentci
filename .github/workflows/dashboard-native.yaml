name: Optional dashboard native qualification
on:
  pull_request:
    paths:
      - Dockerfile
      - .dockerignore
      - package.json
      - package-lock.json
      - npm-shrinkwrap.json
      - tsconfig*.json
      - LICENSE
      - apps/dashboard/**
      - packages/**
      - scripts/build-assets.mjs
      - scripts/dashboard-*.mjs
      - scripts/lib/dashboard-*.mjs
      - scripts/lib/image-smoke-state.mjs
      - scripts/lib/smoke-resources.mjs
      - scripts/image-smoke-cleanup.mjs
      - scripts/check-scan.mjs
      - .github/workflows/dashboard-native.yaml
  workflow_dispatch:
env:
  DOCKER_BUILD_RECORD_UPLOAD: "false"
permissions:
  contents: read
concurrency:
  group: dashboard-native-${{ github.ref }}
  cancel-in-progress: false
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-24.04, arch: amd64 }
          - { runner: ubuntu-24.04-arm, arch: arm64 }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: { persist-credentials: false }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with: { node-version: 26.10.0 }
      - name: Bind exact source, lockfiles and native architecture
        id: source
        env:
          AGENTCI_DASHBOARD_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node scripts/dashboard-native-acceptance.mjs source '${{ matrix.arch }}'
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
      - name: Build optional dashboard target locally without publication
        timeout-minutes: 25
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: .
          target: dashboard
          platforms: linux/${{ matrix.arch }}
          load: true
          push: false
          provenance: false
          tags: agentci-dashboard:ci-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.arch }}
          build-args: |
            SOURCE_COMMIT=${{ steps.source.outputs.source }}
            ROOT_LOCK_SHA256=${{ steps.source.outputs.root_lock }}
            DASHBOARD_LOCK_SHA256=${{ steps.source.outputs.dashboard_lock }}
            DASHBOARD_VERSION=${{ steps.source.outputs.dashboard_version }}
      - name: Qualify actual native runtime, privacy, notices and pinned scan
        id: runtime
        timeout-minutes: 12
        env:
          AGENTCI_DASHBOARD_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node scripts/dashboard-native-acceptance.mjs qualify 'agentci-dashboard:ci-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.arch }}'
      - name: Recover only owned smoke resources
        if: always()
        timeout-minutes: 2
        env:
          AGENTCI_IMAGE_SMOKE_OUTCOME: ${{ steps.runtime.outcome }}
        run: node scripts/image-smoke-cleanup.mjs
      - name: Publish only bounded allowlisted public evidence
        if: always()
        run: node scripts/dashboard-public-artifacts.mjs
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: dashboard-native-${{ matrix.arch }}-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 7
          include-hidden-files: true
          if-no-files-found: error
          path: .agentci/artifacts/dashboard-native-public/
