name: Optional dashboard native qualification
on:
  pull_request:
    paths:
      - Dockerfile
      - .dockerignore
      - package.json
      - package-lock.json
      - npm-shrinkwrap.json
      - tsconfig*.json
      - LICENSE
      - apps/dashboard/**
      - packages/**
      - scripts/build-assets.mjs
      - scripts/dashboard-*.mjs
      - scripts/dashboard-notices/**
      - scripts/lib/dashboard-*.mjs
      - scripts/lib/image-smoke-state.mjs
      - scripts/lib/smoke-resources.mjs
      - scripts/image-smoke-cleanup.mjs
      - scripts/check-scan.mjs
      - .github/workflows/dashboard-native.yaml
  workflow_dispatch:
    inputs:
      qualification:
        description: Native qualification to run
        type: choice
        default: dashboard
        options: [dashboard, eval-storage-diagnostic]
      expected_source:
        description: Exact source SHA required for the storage diagnostic
        type: string
        required: false
env:
  DOCKER_BUILD_RECORD_UPLOAD: "false"
permissions:
  contents: read
concurrency:
  group: dashboard-native-${{ github.ref }}
  cancel-in-progress: false
jobs:
  native:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.qualification != 'eval-storage-diagnostic' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-24.04, arch: amd64 }
          - { runner: ubuntu-24.04-arm, arch: arm64 }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: { persist-credentials: false }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with: { node-version: 26.10.0 }
      - name: Bind exact source, lockfiles and native architecture
        id: source
        env:
          AGENTCI_DASHBOARD_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node scripts/dashboard-native-acceptance.mjs source '${{ matrix.arch }}'
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
      - name: Build optional dashboard target locally without publication
        timeout-minutes: 25
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: .
          target: dashboard
          platforms: linux/${{ matrix.arch }}
          load: true
          push: false
          provenance: false
          tags: agentci-dashboard:ci-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.arch }}
          build-args: |
            SOURCE_COMMIT=${{ steps.source.outputs.source }}
            ROOT_LOCK_SHA256=${{ steps.source.outputs.root_lock }}
            DASHBOARD_LOCK_SHA256=${{ steps.source.outputs.dashboard_lock }}
            DASHBOARD_VERSION=${{ steps.source.outputs.dashboard_version }}
      - name: Qualify actual native runtime, privacy, notices and pinned scan
        id: runtime
        timeout-minutes: 12
        env:
          AGENTCI_DASHBOARD_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node scripts/dashboard-native-acceptance.mjs qualify 'agentci-dashboard:ci-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.arch }}'
      - name: Recover only owned smoke resources
        if: always()
        timeout-minutes: 2
        env:
          AGENTCI_IMAGE_SMOKE_OUTCOME: ${{ steps.runtime.outcome }}
        run: node scripts/image-smoke-cleanup.mjs
      - name: Publish only bounded allowlisted public evidence
        if: always()
        run: node scripts/dashboard-public-artifacts.mjs
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: dashboard-native-${{ matrix.arch }}-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 7
          include-hidden-files: true
          if-no-files-found: error
          path: .agentci/artifacts/dashboard-native-public/
  eval-storage-diagnostic:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.qualification == 'eval-storage-diagnostic' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-24.04, arch: amd64 }
          - { runner: ubuntu-24.04-arm, arch: arm64 }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    env:
      AGENTCI_CONTAINER_ENGINE: docker
      AGENTCI_STORAGE_MODE: ${{ inputs.qualification }}
      INPUT_EXPECTED_SOURCE: ${{ inputs.expected_source }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: { persist-credentials: false, fetch-depth: 2 }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with: { node-version: 26.10.0 }
      - name: Bind exact diagnostic source and owned recovery state
        id: source
        run: node scripts/eval-worker-native-storage-diagnostic.mjs source '${{ matrix.arch }}'
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
      - name: Build only the failing evaluator worker target without publication
        timeout-minutes: 25
        run: |
          docker buildx build --load --provenance=false --platform 'linux/${{ matrix.arch }}' --target eval-worker \
            --tag 'agentci-eval-worker:storage-diagnostic-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.arch }}' \
            --label 'org.opencontainers.image.revision=${{ steps.source.outputs.source }}' \
            --label 'org.agentci.source-tree=${{ steps.source.outputs.tree }}' \
            --label 'org.agentci.candidate=${{ steps.source.outputs.candidate }}' \
            --label 'org.agentci.root-lock=${{ steps.source.outputs.root_lock }}' \
            --label 'org.agentci.native-pins=${{ steps.source.outputs.native_pins }}' \
            --label 'org.agentci.native-role=eval-worker' .
      - name: Observe the unchanged scanner filesystem and retain strict scan outcome
        id: diagnose
        timeout-minutes: 12
        run: node scripts/eval-worker-native-storage-diagnostic.mjs diagnose
      - name: Recover only owned resources and index diagnostic evidence
        if: always()
        timeout-minutes: 3
        env:
          AGENTCI_STORAGE_DIAGNOSTIC_OUTCOME: ${{ steps.diagnose.outcome }}
        run: node scripts/eval-worker-native-storage-diagnostic.mjs finalize
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: eval-worker-storage-diagnostic-${{ matrix.arch }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: .agentci/artifacts/eval-worker-native-storage-diagnostic/
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: error
