name: Temporary customer demo
on:
  push:
    branches: [main]
    paths: [releases/m3-customer-demo.json]
  workflow_dispatch:
    inputs:
      candidate_and_fixtures:
        description: Approved exact release source/checksums and connector-created seeded/fixed fixture subjects JSON
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: agentci-temporary-customer-demo
  cancel-in-progress: false
jobs:
  demo:
    if: github.repository == 'alimobrem/agentci' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: { ref: '${{ github.sha }}', persist-credentials: false, fetch-depth: 0 }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with: { node-version: 26.10.0, cache: npm }
      - run: npm install --global npm@12.2.0
      - run: npm ci && npm run build
      - name: Validate public candidate/fixture inputs
        env:
          CANDIDATE_FIXTURES: ${{ inputs.candidate_and_fixtures }}
        run: |
          node --input-type=module - <<'JS'
          import {writeFileSync,readFileSync} from 'node:fs';
          import {customerActivationInput} from './scripts/lib/customer-activation.mjs';
          import {validateCustomerInputs} from './scripts/lib/customer-acceptance-preflight.mjs';
          const input=process.env.GITHUB_EVENT_NAME==='push'?customerActivationInput('demo',JSON.parse(readFileSync('releases/m3-customer-demo.json','utf8')),process.env.GITHUB_SHA):JSON.parse(process.env.CANDIDATE_FIXTURES);validateCustomerInputs(input.fixtures);
          if(input.fixtures.serviceSource!==process.env.GITHUB_SHA||!(/^[a-f0-9]{40}$/.test(input.releaseSource)))throw Error('Exact source required');
          for(const key of ['packageManifestSha256','packageSha256','imagesManifestSha256','publicationEvidenceSha256'])if(!(/^[a-f0-9]{64}$/.test(input[key])))throw Error('Pinned artifact checksums required');
          writeFileSync('customer-demo-input.json',JSON.stringify(input),{mode:0o600});
          JS
      - name: Start owned PostgreSQL with per-run private credentials
        id: customer_database
        run: node scripts/m3-customer-ci-database.mjs start
      - name: Start owned temporary Temporal
        id: customer_temporal
        run: |
          docker run -d --name "agentci-customer-temporal-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" --label "agentci.customer.infra=$GITHUB_RUN_ID:$GITHUB_RUN_ATTEMPT" --label "agentci.customer.source=$GITHUB_SHA" -p 127.0.0.1:7233:7233 temporalio/temporal:latest@sha256:ad4c82c97bd12b417d1ea942610dbcd511afb250c4d5ed26c694009533df447e server start-dev --ip 0.0.0.0 --headless
          node --input-type=module - <<'JS'
          import {Connection} from '@temporalio/client';
          let ready=false;for(let i=0;i<60;i++){try{const c=await Connection.connect({address:'127.0.0.1:7233',connectTimeout:'2 seconds'});await c.close();ready=true;break;}catch{await new Promise(r=>setTimeout(r,1000));}}if(!ready)throw Error('Temporary Temporal unavailable');
          JS
      - name: Execute downloaded exact-source temporary customer demo
        id: customer_demo
        env:
          AGENTCI_CUSTOMER_APP_PRIVATE_KEY: ${{ secrets.AGENTCI_CUSTOMER_APP_PRIVATE_KEY }}
          AGENTCI_CUSTOMER_TEMPORAL_ADDRESS: 127.0.0.1:7233
        run: |
          node --input-type=module - customer-demo-input.json <<'JS'
          import {customerDatabaseUrl} from './scripts/lib/customer-ci-database.mjs';
          process.env.AGENTCI_CUSTOMER_DATABASE_URL=await customerDatabaseUrl(process.env.AGENTCI_CUSTOMER_DATABASE_CONFIG_FILE);
          await import('./scripts/m3-customer-live-demo.mjs');
          JS
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: temporary-customer-demo
          path: customer-live-demo.json
          if-no-files-found: warn
      - name: Stop owned PostgreSQL and remove private credentials
        if: always()
        env:
          AGENTCI_CUSTOMER_DEMO_OUTCOME: ${{ steps.customer_demo.outcome }}
          AGENTCI_CUSTOMER_DATABASE_START_OUTCOME: ${{ steps.customer_database.outcome }}
        run: node scripts/m3-customer-ci-database.mjs stop
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with: { name: customer-ci-database-cleanup, path: customer-ci-database-cleanup.json, if-no-files-found: warn }
      - name: Stop owned temporary Temporal and public scratch
        if: always()
        env:
          AGENTCI_CUSTOMER_DEMO_OUTCOME: ${{ steps.customer_demo.outcome }}
          AGENTCI_CUSTOMER_TEMPORAL_START_OUTCOME: ${{ steps.customer_temporal.outcome }}
        run: node scripts/m3-customer-ci-database.mjs stop-temporal
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: customer-ci-infrastructure-cleanup
          path: |
            customer-infrastructure-teardown.json
            customer-ci-temporal-cleanup.json
          if-no-files-found: warn
