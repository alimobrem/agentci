name: Verify published image downloads
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 620230fd49d09e788d9a6a2783b57428882f5927
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with: { node-version: 26.10.0 }
      - name: Anonymously pull the immutable release digests
        run: |
          docker pull ghcr.io/alimobrem/agentci-api@sha256:35ff1317c2b91aa39be4289e7a0ccc8427611aadd69ac5a24f416db3497b5063
          docker pull ghcr.io/alimobrem/agentci-worker@sha256:c1dc99cd51b7490e1033362e30e14c7e967e09e659f73aaeaae1faa1a4186a88
          docker tag ghcr.io/alimobrem/agentci-api@sha256:35ff1317c2b91aa39be4289e7a0ccc8427611aadd69ac5a24f416db3497b5063 agentci-api:downloaded
          docker tag ghcr.io/alimobrem/agentci-worker@sha256:c1dc99cd51b7490e1033362e30e14c7e967e09e659f73aaeaae1faa1a4186a88 agentci-worker:downloaded
          for role in api worker; do
            test "$(docker image inspect --format '{{.Architecture}}' agentci-$role:downloaded)" = amd64
            test "$(docker image inspect --format '{{index .Config.Labels "org.opencontainers.image.revision"}}' agentci-$role:downloaded)" = 620230fd49d09e788d9a6a2783b57428882f5927
          done
      - name: Verify native amd64 published runtime
        run: node scripts/image-smoke.mjs downloaded > downloaded-image-smoke.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: published-amd64-runtime
          path: downloaded-image-smoke.json
          if-no-files-found: error
