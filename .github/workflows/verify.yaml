name: Verify
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  fast-feedback:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: { persist-credentials: false }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with: { node-version: 26.10.0, cache: npm }
      - run: npm install --global npm@12.2.0
      - run: npm ci
      - run: npm run check:fast
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with: { name: fast-feedback, path: .agentci/artifacts/delivery/fast-latest.json, include-hidden-files: true }
  contracts-and-runtime:
    # Explicit compatibility cohort; native Podman acceptance is separately required before adoption.
    env: { AGENTCI_CONTAINER_ENGINE: docker }
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.6-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
        env:
          POSTGRES_PASSWORD: agentci-ci-only
          POSTGRES_DB: agentci
        ports: [5432:5432]
        options: --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: { persist-credentials: false }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with: { node-version: 26.10.0, cache: npm }
      - run: npm install --global npm@12.2.0
      - run: npm ci
      - run: npm run check:fast
      - run: npm run check:api:compat
      - name: Verify requirement reconciliation and captured history
        run: node scripts/reconcile-acceptance.mjs --check
      - name: Verify frozen provider eval detects regressions
        run: mkdir -p releases && node scripts/verify-provider-eval.mjs > releases/provider-contract-eval.json
      - name: Verify reviewer eval rejects external dispatch from synthetic mode
        run: mkdir -p releases && node scripts/verify-reviewer-eval.mjs > releases/reviewer-boundary-eval.json
      - name: Verify finding eval rejects wrong reproduction identity
        run: mkdir -p releases && node scripts/verify-finding-eval.mjs > releases/finding-boundary-eval.json
      - run: npm run check:workflows
      - name: Verify evaluator deployment boundary
        run: node scripts/check-eval-deployment.mjs
      - run: npm run build
      - run: npm audit --audit-level=high
      - name: Start isolated Temporal
        run: docker run -d --name agentci-ci-temporal -p 127.0.0.1:7233:7233 temporalio/temporal:latest@sha256:ad4c82c97bd12b417d1ea942610dbcd511afb250c4d5ed26c694009533df447e server start-dev --ip 0.0.0.0 --headless
      - name: Wait for Temporal
        run: |
          node --input-type=module - <<'JS'
          import {Connection} from '@temporalio/client';
          let connected=false;
          for(let i=0;i<30;i++) { try { const c=await Connection.connect({address:'127.0.0.1:7233',connectTimeout:'2 seconds'});await c.close();connected=true;break; } catch { await new Promise(r=>setTimeout(r,1000)); } }
          if(!connected)throw new Error('Temporal unavailable');
          JS
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
      - name: Build isolated eval runner
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: .
          target: eval-runner
          load: true
          tags: agentci-eval-runner:ci
          cache-from: type=gha,scope=agentci-eval-runner
          cache-to: type=gha,scope=agentci-eval-runner,mode=max,ignore-error=true
      - name: Build trusted-dependency self-eval runner
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: .
          target: eval-agentci
          load: true
          tags: agentci-eval-agentci:ci
          cache-from: type=gha,scope=agentci-eval-agentci
          cache-to: type=gha,scope=agentci-eval-agentci,mode=max,ignore-error=true
      - name: Build optional eval engines
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: .
          target: eval-engines
          load: true
          tags: agentci-eval-engines:ci
          cache-from: type=gha,scope=agentci-eval-engines
          cache-to: type=gha,scope=agentci-eval-engines,mode=max,ignore-error=true
      - name: Integration tests with mandatory real eval isolation
        run: |
          AGENTCI_TEST_RUNNER_IMAGE=$(docker image inspect agentci-eval-runner:ci --format '{{.Id}}')
          test -n "$AGENTCI_TEST_RUNNER_IMAGE"
          AGENTCI_TEST_ENGINES_IMAGE=$(docker image inspect agentci-eval-engines:ci --format '{{.Id}}')
          test -n "$AGENTCI_TEST_ENGINES_IMAGE"
          AGENTCI_TEST_SELF_IMAGE=$(docker image inspect agentci-eval-agentci:ci --format '{{.Id}}')
          test -n "$AGENTCI_TEST_SELF_IMAGE"
          export AGENTCI_TEST_RUNNER_IMAGE AGENTCI_TEST_ENGINES_IMAGE AGENTCI_TEST_SELF_IMAGE
          npm run test:integration
        env:
          # Fixed test-only auth for this disposable service; never a deployment credential.
          AGENTCI_TEST_DATABASE_URL: postgresql://127.0.0.1:5432/agentci
          PGUSER: postgres
          PGPASSWORD: agentci-ci-only
          AGENTCI_TEST_TEMPORAL_ADDRESS: 127.0.0.1:7233
      - name: Package smoke and installed PostgreSQL readers
        run: mkdir -p releases && npm pack --pack-destination releases && node scripts/package-smoke.mjs --postgres-readers
        env:
          AGENTCI_TEST_DATABASE_URL: postgresql://127.0.0.1:5432/agentci
          PGUSER: postgres
          PGPASSWORD: agentci-ci-only
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
      - name: Build API image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: .
          target: api
          load: true
          tags: agentci-api:ci
          cache-from: type=gha,scope=agentci-api
          cache-to: type=gha,scope=agentci-api,mode=max,ignore-error=true
      - name: Build worker image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: .
          target: worker
          load: true
          tags: agentci-worker:ci
          cache-from: type=gha,scope=agentci-worker
          cache-to: type=gha,scope=agentci-worker,mode=max,ignore-error=true
      - name: Build isolated eval worker image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: .
          target: eval-worker
          load: true
          tags: agentci-eval-worker:ci
          labels: |
            org.opencontainers.image.source=https://github.com/alimobrem/agentci
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=agentci-eval-worker
          cache-to: type=gha,scope=agentci-eval-worker,mode=max,ignore-error=true
      - name: Scan service images
        run: |
          mkdir -p scan-results
          docker volume create agentci-trivy-cache
          for role in api worker eval-worker eval-runner eval-engines eval-agentci; do
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v agentci-trivy-cache:/root/.cache/trivy aquasec/trivy:0.75.0@sha256:af6acf9a6b85dfe389a1941505c0ce9efef52a4719635e1a962f022a3d855daa image --scanners vuln --format json agentci-$role:ci > scan-results/$role.json
            node scripts/check-scan.mjs scan-results/$role.json
          done
      - name: Verify compiled containers
        run: node scripts/image-smoke.mjs ci > .agentci/artifacts/image-smoke.json
      - name: Verify native artifact provenance
        run: |
          for role in worker eval-worker; do
            image=$(docker image inspect "agentci-$role:ci" --format '{{.Id}}')
            node scripts/verify-native-provenance.mjs "$image" > ".agentci/artifacts/native-provenance-$role.json"
          done
      - name: Verify isolated eval worker runtime
        run: node scripts/eval-worker-image-smoke.mjs agentci-eval-worker:ci agentci-eval-runner:ci > .agentci/artifacts/eval-worker-image-smoke.json
      - name: Collect verification evidence
        run: node scripts/verification-summary.mjs
        env:
          AGENTCI_CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: m1-verification
          include-hidden-files: true
          if-no-files-found: error
          path: |
            releases/*.tgz
            scan-results/*.json
            .agentci/artifacts/verification.json
            .agentci/artifacts/delivery/fast-latest.json
            .agentci/artifacts/api-compatibility.json
            .agentci/artifacts/image-smoke.json
            .agentci/artifacts/eval-worker-image-smoke.json
            .agentci/artifacts/native-provenance-*.json
