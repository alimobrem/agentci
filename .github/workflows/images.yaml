name: Publish service images
on:
  workflow_dispatch:
    inputs:
      version:
        description: Immutable candidate version; must match package.json
        required: true
permissions:
  contents: read
  packages: write
jobs:
  verify:
    uses: ./.github/workflows/verify.yaml
    permissions: { contents: read }
  publish:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: { persist-credentials: false }
      - name: Validate candidate identity
        env: { CANDIDATE_VERSION: "${{ inputs.version }}" }
        run: |
          node -e 'const p=require("./package.json");if(process.env.CANDIDATE_VERSION!==p.version||!/^\d+\.\d+\.\d+(?:-[a-z0-9.-]+)?$/.test(p.version))process.exit(1)'
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1
        with: { platforms: arm64 }
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        id: api
        with:
          context: .
          target: api
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ghcr.io/alimobrem/agentci-api:${{ inputs.version }}
          labels: |
            org.opencontainers.image.source=https://github.com/alimobrem/agentci
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=agentci-api-publish
          cache-to: type=gha,scope=agentci-api-publish,mode=max
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        id: worker
        with:
          context: .
          target: worker
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ghcr.io/alimobrem/agentci-worker:${{ inputs.version }}
          labels: |
            org.opencontainers.image.source=https://github.com/alimobrem/agentci
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=agentci-worker-publish
          cache-to: type=gha,scope=agentci-worker-publish,mode=max
      - name: Record published identities
        env:
          API_DIGEST: ${{ steps.api.outputs.digest }}
          WORKER_DIGEST: ${{ steps.worker.outputs.digest }}
          CANDIDATE_VERSION: ${{ inputs.version }}
        run: |
          printf 'API: ghcr.io/alimobrem/agentci-api@%s\nWorker: ghcr.io/alimobrem/agentci-worker@%s\n' "$API_DIGEST" "$WORKER_DIGEST" >> "$GITHUB_STEP_SUMMARY"
          mkdir -p published
          node --input-type=module - <<'JS'
          import {writeFileSync} from 'node:fs';
          writeFileSync('published/images.json',JSON.stringify({version:process.env.CANDIDATE_VERSION,sourceCommit:process.env.GITHUB_SHA,platforms:['linux/amd64','linux/arm64'],api:`ghcr.io/alimobrem/agentci-api@${process.env.API_DIGEST}`,worker:`ghcr.io/alimobrem/agentci-worker@${process.env.WORKER_DIGEST}`},null,2)+'\n');
          JS
      - name: Scan each published platform
        env:
          API_DIGEST: ${{ steps.api.outputs.digest }}
          WORKER_DIGEST: ${{ steps.worker.outputs.digest }}
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: |
          docker volume create agentci-publish-trivy
          for role in api worker; do
            if [ "$role" = api ]; then digest="$API_DIGEST"; else digest="$WORKER_DIGEST"; fi
            for arch in amd64 arm64; do
              docker run --rm -e TRIVY_USERNAME -e TRIVY_PASSWORD -v agentci-publish-trivy:/root/.cache/trivy aquasec/trivy:0.75.0@sha256:af6acf9a6b85dfe389a1941505c0ce9efef52a4719635e1a962f022a3d855daa image --image-src remote --platform "linux/$arch" --scanners vuln --format json "ghcr.io/alimobrem/agentci-$role@$digest" > "published/$role-$arch-scan.json"
              node scripts/check-scan.mjs "published/$role-$arch-scan.json"
            done
          done
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: published-images
          path: published/
          if-no-files-found: error
