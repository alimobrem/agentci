name: Publish service images
on:
  workflow_dispatch:
    inputs:
      version:
        description: New immutable candidate version; must match package.json
        required: true
permissions:
  contents: read
  packages: write
concurrency:
  group: agentci-image-publication-${{ inputs.version }}
  cancel-in-progress: false
jobs:
  verify:
    uses: ./.github/workflows/verify.yaml
    permissions: { contents: read }
  publish:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        role: [api, worker, eval-worker, eval-runner, eval-engines, eval-agentci]
    env:
      IMAGE_ROLE: ${{ matrix.role }}
      CANDIDATE_VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: { persist-credentials: false }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with: { node-version: 26.10.0 }
      - name: Refuse existing version tags or ambiguous registry state
        env: { GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
        run: node scripts/image-publication.mjs preflight
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1
        with: { platforms: arm64 }
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        id: image
        with:
          context: .
          target: ${{ matrix.role }}
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ghcr.io/alimobrem/agentci-${{ matrix.role }}:${{ inputs.version }}
          labels: |
            org.opencontainers.image.source=https://github.com/alimobrem/agentci
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ inputs.version }}
          cache-from: type=gha,scope=agentci-${{ matrix.role }}-publish
          cache-to: type=gha,scope=agentci-${{ matrix.role }}-publish,mode=max,ignore-error=true
      - name: Record published identity
        env: { IMAGE_DIGEST: "${{ steps.image.outputs.digest }}" }
        run: node scripts/image-publication.mjs record
      - name: Scan every published platform and retain native inventories
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: |
          docker volume create agentci-publish-trivy
          result=0
          image="ghcr.io/alimobrem/agentci-$IMAGE_ROLE@$IMAGE_DIGEST"
          docker buildx imagetools inspect "$image" --raw > "published/$IMAGE_ROLE-index.json"
          for arch in amd64 arm64; do
            if docker run --rm -e TRIVY_USERNAME -e TRIVY_PASSWORD -v agentci-publish-trivy:/root/.cache/trivy aquasec/trivy:0.75.0@sha256:af6acf9a6b85dfe389a1941505c0ce9efef52a4719635e1a962f022a3d855daa image --image-src remote --platform "linux/$arch" --scanners vuln --format json "$image" > "published/$IMAGE_ROLE-$arch-scan.json"; then
              node scripts/check-scan.mjs "published/$IMAGE_ROLE-$arch-scan.json" || result=1
            else
              result=1
            fi
            if [ "$IMAGE_ROLE" = worker ] || [ "$IMAGE_ROLE" = eval-worker ]; then
              # Classic Docker stores cannot attach two architectures to one index reference.
              # Resolve and retain the index, then pull each unique child manifest by digest.
              if native_ref=$(node scripts/image-publication.mjs platform "published/$IMAGE_ROLE-index.json" "$arch") && docker pull --platform "linux/$arch" "$native_ref"; then
                native=$(docker image inspect "$native_ref" --format '{{.Id}}')
                if node scripts/verify-native-provenance.mjs "$native" > "published/$IMAGE_ROLE-$arch-native.json"; then
                  node --input-type=module -e 'import {readFileSync} from "node:fs"; const report=JSON.parse(readFileSync(process.argv[1],"utf8")); if(report.platform!=="linux/"+process.argv[2])throw new Error("Native inventory platform mismatch")' "published/$IMAGE_ROLE-$arch-native.json" "$arch" || result=1
                else
                  result=1
                fi
              else
                result=1
              fi
            fi
          done
          exit "$result"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: published-images-${{ matrix.role }}
          path: published/
          if-no-files-found: error
