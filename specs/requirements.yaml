requirements:
  - id: SECTION-1
    title: 1. Executive Summary
    type: functional
    status: draft
    text: 1. Executive Summary
    source:
      path: specs/agentci-full-spec.md
      section: "1"
      line: 12
    implementation:
      status: not-started
      milestone: M1
      evidence: []
  - id: SPEC-1-001
    title: 1. Executive Summary
    type: functional
    status: draft
    text: AgentCI is a model-agnostic engineering control plane for software developed by humans and
      coding agents, and for software that itself contains autonomous or semi-autonomous agents.
    source:
      path: specs/agentci-full-spec.md
      section: "1"
      line: 14
    implementation:
      status: not-started
      milestone: M1
      evidence: []
  - id: SPEC-1-002
    title: 1. Executive Summary
    type: functional
    status: draft
    text: AgentCI extends existing software delivery rather than replacing it. Git remains the system of
      record for intended change. Pull requests remain the principal review and approval mechanism.
      Existing CI engines remain execution engines. Existing deployment and GitOps systems remain
      deployment engines. OpenTelemetry remains the telemetry foundation. Model Context Protocol
      (MCP) is a preferred tool boundary. Existing observability platforms remain valid destinations
      for logs, metrics, and traces.
    source:
      path: specs/agentci-full-spec.md
      section: "1"
      line: 16
    implementation:
      status: not-started
      milestone: M1
      evidence: []
  - id: SPEC-1-003
    title: 1. Executive Summary
    type: functional
    status: draft
    text: "AgentCI adds six core capabilities:"
    source:
      path: specs/agentci-full-spec.md
      section: "1"
      line: 18
    implementation:
      status: not-started
      milestone: M1
      evidence: []
  - id: SPEC-1-004
    title: 1. Executive Summary
    type: functional
    status: draft
    text: 1. **Semantic Change Intelligence** - explains changes in terms of intent, requirements,
      behavior, capabilities, permissions, tools, models, policies, and risk rather than only line
      diffs.
    source:
      path: specs/agentci-full-spec.md
      section: "1"
      line: 20
    implementation:
      status: not-started
      milestone: M1
      evidence: []
  - id: SPEC-1-005
    title: 1. Executive Summary
    type: functional
    status: draft
    text: 2. **Behavioral Eval Orchestration** - selects and runs deterministic tests, agent
      evaluations, adversarial scenarios, model matrices, and regression suites based on what
      changed.
    source:
      path: specs/agentci-full-spec.md
      section: "1"
      line: 21
    implementation:
      status: not-started
      milestone: M1
      evidence: []
  - id: SPEC-1-006
    title: 1. Executive Summary
    type: functional
    status: draft
    text: 3. **Evidence Graph** - creates a queryable lineage graph connecting requirement -> code ->
      test/eval -> trace -> PR -> build -> release -> deployment -> production outcome -> incident
      -> repair.
    source:
      path: specs/agentci-full-spec.md
      section: "1"
      line: 22
    implementation:
      status: not-started
      milestone: M1
      evidence: []
  - id: SPEC-1-007
    title: 1. Executive Summary
    type: functional
    status: draft
    text: 4. **Production Correlation** - correlates agent actions with application and infrastructure
      outcomes to identify likely behavior failures and regressions.
    source:
      path: specs/agentci-full-spec.md
      section: "1"
      line: 23
    implementation:
      status: not-started
      milestone: M1
      evidence: []
  - id: SPEC-1-008
    title: 1. Executive Summary
    type: functional
    status: draft
    text: 5. **Regression Learning Loop** - converts reproducible production failures into permanent
      executable regression cases.
    source:
      path: specs/agentci-full-spec.md
      section: "1"
      line: 24
    implementation:
      status: not-started
      milestone: M1
      evidence: []
  - id: SPEC-1-009
    title: 1. Executive Summary
    type: functional
    status: draft
    text: 6. **Risk and Autonomy Control** - independently controls what the system may detect,
      diagnose, fix, submit, merge, deploy, and remediate automatically.
    source:
      path: specs/agentci-full-spec.md
      section: "1"
      line: 25
    implementation:
      status: not-started
      milestone: M1
      evidence: []
  - id: SPEC-1-010
    title: 1. Executive Summary
    type: functional
    status: draft
    text: The first commercial/product wedge is **AI PR Review / Semantic PR Review**. The deeper
      platform expands from PR evidence into release evidence, runtime evidence, incident learning,
      and controlled self-repair.
    source:
      path: specs/agentci-full-spec.md
      section: "1"
      line: 27
    implementation:
      status: not-started
      milestone: M1
      evidence: []
  - id: SPEC-1-011
    title: 1. Executive Summary
    type: functional
    status: draft
    text: The system must work with OpenAI, Anthropic, xAI, Google, open-weight/local models, and future
      providers through adapters. It must support GitHub first, then GitLab and others. It must
      support generic CI runners, with first-class Tekton/OpenShift Pipelines integration. It must
      support Kubernetes/OpenShift deeply without requiring Kubernetes for the standalone product.
    source:
      path: specs/agentci-full-spec.md
      section: "1"
      line: 29
    implementation:
      status: not-started
      milestone: M1
      evidence: []
